<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookWise - Control de Libros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 BookWise</h1>
            <p>Control de Compra de Libros</p>
        </header>

        <main>
            <!-- Formulario de Registro -->
            <section class="form-card">
                <h3>Registrar Nueva Compra</h3>
                <form id="book-form">
                    <div class="form-group">
                        <input type="text" id="titulo" placeholder="Título del libro" required>
                        <input type="text" id="autor" placeholder="Autor" required>
                    </div>
                    <div class="form-group">
                        <input type="number" id="precio" step="0.01" placeholder="Precio ($)" required>
                        <input type="date" id="fecha" required>
                    </div>
                    <button type="submit" class="btn-save">Guardar Libro</button>
                </form>
            </section>

            <!-- Dashboard y Filtros -->
            <section class="controls">
                <div class="search-box">
                    <input type="text" id="search" placeholder="Buscar por título o autor...">
                </div>
                <div class="total-box">
                    <span>Total Gastado: </span>
                    <strong id="total-gastado">$0.00</strong>
                </div>
            </section>

            <!-- Tabla de Resultados -->
            <section class="table-container">
                <table id="books-table">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Precio</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="books-body">
                        <!-- Los datos se insertarán aquí con JS -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
